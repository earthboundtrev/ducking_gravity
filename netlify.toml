[build]
  command = "echo static-publish"
  publish = "."

[functions]
  directory = "netlify/functions"

# Netlify automatically uses 404.html for 404 errors
# Pretty URL for summer camps (static file is summercamps.html)
[[redirects]]
  from = "/summercamps"
  to = "/summercamps.html"
  status = 200

[[redirects]]
  from = "/api/smartastro-availability"
  to = "/.netlify/functions/smartastro-availability"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact-form"
  status = 200

# Lyra classes retired (#21) — keep lyra.html in repo; do not serve publicly
[[redirects]]
  from = "/lyra.html"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/lyra"
  to = "/index.html"
  status = 301
  force = true

# This catch-all is for SPA routing - it only applies if no file matches
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prefer Site settings → Environment variables in Netlify UI so values are not committed.
# Contact form secrets (RESEND_API_KEY, RECAPTCHA_SECRET_KEY, RESEND_FROM) stay server-only.